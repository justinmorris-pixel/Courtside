<style>
:root{
  --bg:#ffffff;--surface:#f3f3f1;--card:#ffffff;--text:#111111;--muted:#666660;--border:#d9d9d3;
  --red:#d7261e;--redbg:#fbe9e8;--redtext:#8f1a14;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111111;--surface:#232323;--card:#1a1a1a;--text:#f2f2ee;--muted:#a3a39c;--border:#363636;
    --redbg:#3a1412;--redtext:#ff9a93;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111111;--surface:#232323;--card:#1a1a1a;--text:#f2f2ee;--muted:#a3a39c;--border:#363636;
  --redbg:#3a1412;--redtext:#ff9a93;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
html.tvmode{background:#000;}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4;}
body.tvmode{background:#000;color:#fff;}
*{box-sizing:border-box;}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 48px;}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.muted{color:var(--muted);font-size:13px;}
.small{font-size:12px;color:var(--muted);}
h1{font-size:20px;font-weight:500;margin:0 0 4px;}
.btn{font:inherit;font-size:15px;height:48px;border-radius:8px;border:0.5px solid var(--border);background:var(--surface);color:var(--text);padding:0 14px;cursor:pointer;touch-action:manipulation;}
.btn:active{transform:scale(0.98);}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);font-weight:500;font-size:17px;}
.btn.sm{height:38px;font-size:13px;}
.btn.sel{background:var(--redbg);color:var(--redtext);border-color:var(--red);}
.btn.sq{width:48px;padding:0;font-size:22px;}
.clk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:36px;font-weight:500;line-height:1.1;}
.step{display:flex;align-items:center;gap:8px;}
.step .val{min-width:64px;text-align:center;font-weight:500;}
.list{border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-top:10px;}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:14px;border-bottom:0.5px solid var(--border);}
.li:last-child{border-bottom:none;}
.li.cur{background:var(--redbg);color:var(--redtext);font-weight:500;}
.li.done{color:var(--muted);}
.banner{background:var(--redbg);color:var(--redtext);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px;}
a.big{display:block;text-align:center;padding:18px;border:0.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);text-decoration:none;font-size:17px;font-weight:500;margin-bottom:12px;}
a.big span{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:4px;}
.tv{height:100vh;height:100dvh;min-height:0;overflow:hidden;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:3vw 4vw;}
.tv .top{display:flex;justify-content:space-between;color:#aaa;letter-spacing:0.2em;font-size:clamp(12px,1.6vw,26px);}
.tv .mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;}
.tv .fit{width:100%;transform-origin:center center;}
html.tvmode,body.tvmode{overflow:hidden;}
.tv .name{font-size:clamp(34px,7.5vw,150px);font-weight:500;line-height:1.1;}
.tv .lbl{color:#aaa;letter-spacing:0.3em;font-size:clamp(12px,1.4vw,24px);margin-top:2vw;}
.tv .clock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(70px,22vw,420px);font-weight:500;line-height:1;letter-spacing:-0.03em;}
.tv .extra{display:flex;justify-content:center;gap:6vw;margin-top:1.5vw;}
.tv .extra .k{color:#aaa;letter-spacing:0.2em;font-size:clamp(11px,1.3vw,22px);text-align:center;}
.tv .extra .v{font-size:clamp(28px,5vw,100px);font-weight:500;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;}
.tv .note{margin-top:2.2vw;font-size:clamp(18px,3vw,56px);line-height:1.3;color:#fff;}
.tv .note .l{margin:0.25em 0;}
.tv.withnote .clock{font-size:clamp(60px,15vw,300px);}
.tv.withnote .name{font-size:clamp(30px,6vw,120px);}
.tv .note.cols{columns:2;column-gap:5vw;text-align:left;display:inline-block;font-size:clamp(16px,2.5vw,46px);}
.tv .note .l{break-inside:avoid;}
.tv.withlist .clock{font-size:clamp(50px,11vw,220px);}
.tv.withlist .name{font-size:clamp(28px,5vw,100px);}
.tv .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #2a2a2a;padding-top:1.2vw;color:#aaa;letter-spacing:0.2em;font-size:clamp(12px,1.6vw,26px);}
.tv .foot b{color:#fff;font-weight:500;}
.tv .motto{color:#d7261e;letter-spacing:0.35em;}
.tv .snd{position:absolute;right:10px;bottom:10px;background:transparent;border:1px solid #333;color:#666;border-radius:6px;font-size:12px;padding:4px 8px;cursor:pointer;}
.tv .st{position:absolute;left:10px;bottom:10px;color:#555;font-size:12px;}
.sbv{height:100vh;height:100dvh;min-height:0;overflow:hidden;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;gap:2vw;padding:3vw 4vw;}
.sbmain{flex:1;min-height:0;display:flex;align-items:center;}
.sbgrid{width:100%;transform-origin:center center;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:2vw;align-items:center;}
.sbv .tn{color:#fff;font-size:clamp(20px,3.6vw,68px);letter-spacing:0.25em;font-weight:500;text-align:center;padding-left:0.25em;overflow:hidden;white-space:nowrap;}
.sbv .bar{height:clamp(8px,1.4vw,26px);border-radius:2px;margin:0.5vw 0 1vw;}
.sbv .box{background:#000;border:2px solid #1d1d1d;border-radius:4px;padding:1vw;}
.sbv svg{display:block;width:100%;height:auto;}
.sbv .gl{color:#e8e8e8;letter-spacing:0.4em;text-align:center;font-size:clamp(11px,1.3vw,24px);margin-bottom:0.8vw;}
.sbg{display:flex;align-items:center;gap:1.2vw;}
.sbq{flex-wrap:wrap;column-gap:3vw;row-gap:1vw;display:flex;justify-content:center;align-items:center;gap:1.5vw;margin-top:1.5vw;color:#9a9a9a;letter-spacing:0.3em;font-size:clamp(11px,1.3vw,24px);}
.sbq .box{width:6vw;min-width:44px;padding:0.5vw 1vw;}
.sbinfo{text-align:center;color:#e8e8e8;letter-spacing:0.15em;font-size:clamp(11px,1.5vw,28px);margin-top:1.2vw;line-height:1.5;}
.sbfoot{text-align:center;color:#d7261e;letter-spacing:0.5em;font-size:clamp(11px,1.4vw,26px);}
.sbv .snd{position:absolute;right:10px;bottom:10px;background:transparent;border:1px solid #333;color:#666;border-radius:6px;font-size:12px;padding:4px 8px;cursor:pointer;}
.sbv .st{position:absolute;left:10px;bottom:10px;color:#555;font-size:12px;}
@keyframes blink{0%{opacity:1}50%{opacity:0.1}100%{opacity:1}}
.blink{animation:blink 1s steps(1,end) 6;}
.inp{font:inherit;width:100%;height:40px;border-radius:8px;border:0.5px solid var(--border);background:var(--surface);color:var(--text);padding:0 8px;text-align:center;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;}
.tin{width:92px;height:48px;text-transform:none;letter-spacing:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;padding:0 4px;}
.btn.tmred{background:var(--red);color:#fff;border-color:var(--red);font-weight:500;}
.btn.tmblk{background:#000;color:#fff;border-color:#888;font-weight:500;}

[hidden]{display:none!important;}
.ip{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:10px 14px;}
.ip-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.ip-top b{font-size:20px;}
.ip-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ipbtn{font:inherit;font-size:17px;min-height:56px;padding:0 20px;border-radius:12px;border:0.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;touch-action:manipulation;}
.ipbtn:active{transform:scale(0.98);}
.ipbtn.red{background:var(--red);color:#fff;border-color:var(--red);font-weight:500;}
.ipbtn.big{min-height:76px;font-size:22px;}
.ip-main{flex:1;min-height:0;}
#i_drill.ip-main{display:grid;grid-template-columns:minmax(240px,1fr) 2.4fr;gap:12px;}
.ip-list{overflow:auto;margin:0;}
.ip-panel{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;}
.ip-panel .card{margin:0;}
.ip-clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ip-big{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(48px,10vh,104px);font-weight:500;line-height:1.05;}
.ip-row{display:flex;gap:10px;margin-top:10px;}
.ip-row .ipbtn{flex:1;}
.ip-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:auto;}
.ip-name{font-size:clamp(26px,5vh,48px);font-weight:500;line-height:1.1;}
#i_sb.ip-main{display:flex;flex-direction:column;gap:10px;}
.ip-scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:#0a0a0a;border-radius:14px;padding:10px 14px;color:#fff;}
.ip-team{display:flex;align-items:center;gap:16px;}
.ip-team.red{border-left:12px solid #d7261e;padding-left:14px;}
.ip-team.blk{justify-content:flex-end;border-right:12px solid #fff;padding-right:14px;}
.ip-tname{font-size:clamp(18px,3.4vh,34px);letter-spacing:0.25em;font-weight:500;}
.ip-score{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(56px,14vh,150px);font-weight:500;line-height:1;}
.ip-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.ip-clockbtn{background:#000;color:#fff;border:2px solid #333;border-radius:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(44px,11vh,120px);padding:4px 24px;cursor:pointer;line-height:1.05;touch-action:manipulation;}
.ip-meta{display:flex;gap:14px;align-items:center;color:#aaa;letter-spacing:0.2em;font-size:14px;}
.ip-shot{background:#000;color:#fff;border:2px solid #333;border-radius:10px;font:inherit;font-size:18px;padding:6px 14px;cursor:pointer;touch-action:manipulation;}
.ip-shot b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:500;margin-left:8px;}
.ip-court{position:relative;flex:1;min-height:0;background:#111;border-radius:14px;overflow:hidden;border:1px solid #2a2a2a;}
.ip-court svg{position:absolute;inset:0;width:100%;height:100%;}
.ip-pts{position:absolute;top:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;padding:8px 0;}
.ip-pt{width:min(22vh,16vw);height:min(22vh,16vw);border-radius:50%;font:inherit;font-size:clamp(28px,6.5vh,64px);font-weight:500;cursor:pointer;touch-action:manipulation;border:5px solid #fff;color:#fff;}
.ip-pt.red{background:#d7261e;}
.ip-pt.blk{background:#000;}
.ip-pt:active{transform:scale(0.96);}
.ip-undo{position:absolute;left:50%;top:14px;transform:translateX(-50%);min-width:160px;}
.ip-start{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);min-width:260px;}
.ip-bottom{display:flex;gap:10px;flex-wrap:wrap;}
.ip-bottom .ipbtn{flex:1;min-width:150px;}
.ip-sit{background:var(--redbg);color:var(--redtext);padding:8px 14px;border-radius:10px;font-size:16px;}
.ip-sheet{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:50;overflow:auto;}
.ip-sheetbox{background:var(--bg);color:var(--text);border-radius:16px;max-width:640px;width:100%;padding:14px;}
@media (max-width:900px){#i_drill.ip-main{grid-template-columns:1fr;}.ip-list{max-height:22vh;}.ip-clocks{grid-template-columns:1fr;}}

function normName(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();}

function bigrams(s){var o={};for(var i=0;i<s.length-1;i++){o[s.substr(i,2)]=(o[s.substr(i,2)]||0)+1;}return o;}
function dice(a,b){if(a===b){return 1;}if(a.length<2||b.length<2){return 0;}var x=bigrams(a),y=bigrams(b),hit=0,tot=0,k;for(k in x){tot+=x[k];if(y[k]){hit+=Math.min(x[k],y[k]);}}for(k in y){tot+=y[k];}return 2*hit/tot;}
function knownDrill(name){var k=normName(name);if(LIBN[k]||DSET[k]){return true;}var best=0;for(var i=0;i<LIB.length;i++){var s=dice(k,normName(LIB[i]));if(s>best){best=s;}}return best>=0.86;}
function settingsFor(name){var k=normName(name);if(DSET[k]){return DSET[k];}if(k.indexOf("perfect defense")===0){return DSET["perfect defense"]||{};}return {};}

function to24(h,m,ap){h=parseInt(h,10);m=parseInt(m,10);if(ap){ap=ap.toUpperCase();h=h%12+(ap==="PM"?12:0);}else if(h<7){h+=12;}return h*60+m;}
function parsePlanText(raw){
 var warn=[],lines=String(raw||"").replace(/\r/g,"").replace(/\u00a0/g," ").replace(/[\u2013\u2014]/g,"-").split("\n");
 var num=null,title="Practice",date="",start=null,total=null,drills=[],lastNote=null;
 var reHead=/^\s*Practice\s*#?\s*(\d+)\b/i;
 var reDate=/((?:Mon|Tues|Wednes|Thurs|Fri|Satur|Sun)day),?\s*([A-Za-z]+)\s+(\d{1,2})(?:,\s*\d{4})?,?\s*(\d{1,2}):(\d{2})\s*([AP]M)?\s*to\s*(\d{1,2}):(\d{2})\s*([AP]M)?\s*\((\d+)\s*min/i;
 var reDrill=/^\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\s+(.+?)\s*\((\d+)\s*min(?:s|utes)?\)\s*(?:-\s*(.*))?$/i;
 var stop=false,firstStart=null;
 lines.forEach(function(L){
  if(stop){return;}
  if(!L.trim()){return;}
  var m=reDrill.exec(L);
  if(m){
   var mins=parseInt(m[6],10),a=to24(m[1],m[2]),b=to24(m[3],m[4]);
   var diff=((b-a)%720+720)%720;
   if(firstStart===null){firstStart=a;}
   var nm=m[5].replace(/\s+/g," ").trim();
   if(diff&&diff!==mins){warn.push("“"+nm+"”: the times say "+diff+" min but the plan says "+mins+" min. Using "+mins+".");}
   var d={n:nm,m:mins,note:"",clk:true};
   var st=settingsFor(nm);for(var f in st){d[f]=st[f];}
   if(m[7]){d.note=smartText(m[7].trim().replace(/[,\s]+$/,""));}
   drills.push({d:d,known:knownDrill(nm)});lastNote=drills.length-1;return;
  }
  var h=reHead.exec(L);
  if(h){if(num!==null){warn.push("The text has more than one practice. Only the first is loaded.");stop=true;return;}num=h[1];title="Practice "+h[1];return;}
  var dm=reDate.exec(L);
  if(dm){date=dm[1]+", "+dm[2].slice(0,3)+" "+parseInt(dm[3],10);start=to24(dm[4],dm[5],dm[6]);total=parseInt(dm[10],10);return;}
  if(lastNote!==null){var x=drills[lastNote].d;x.note=(x.note?x.note+" ":"")+smartText(L.trim().replace(/[,\s]+$/,""));}
 });
 if(!drills.length){return {ok:false,error:"I couldn’t find any drill lines. Paste the plan exactly as it comes out of the planner, with lines like “2:30-2:33  Stretch (3 min)”."};}
 var sum=0;drills.forEach(function(x){sum+=x.d.m;});
 if(start===null){start=firstStart;warn.push("No date and start-time line found. Using the first drill’s time as the start.");}
 if(total===null){total=sum;}
 if(total!==sum){warn.push("The header says "+total+" min but the drills add up to "+sum+" min.");}
 var id="p"+(num!==null?num:String(Date.now()).slice(-6));
 var unknown=[];drills.forEach(function(x){if(!x.known){unknown.push(x.d.n);}});
 var plan={id:id,title:title,date:date||"Imported plan",start:start,total:total,drills:drills.map(function(x){return x.d;})};
 return {ok:true,plan:plan,warnings:warn,unknown:unknown};
}

  if(JSON.stringify(PLANS[id])!==JSON.stringify(p)){PLANS[id]=p;changed=true;}

}

function startFirebase(code){
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  var db=firebase.database();fbBase=db.ref("rooms/"+code);
  var started=false,timeout=setTimeout(function(){if(!loaded){setStatus("Can\u2019t reach the scoreboard server yet. The screens may be out of date.");}},10000);
  db.ref(".info/connected").on("value",function(s){if(s.val()===true){if(loaded){setStatus("");}}else if(loaded){setStatus("Offline. Trying to reconnect\u2026");}});
  ref={
   set:function(o){return Promise.race([fbBase.child("state").set(JSON.stringify(o)),new Promise(function(r){setTimeout(r,6000);})]);},
   onSnapshot:function(cb,err){fbBase.child("state").on("value",function(s){var v=s.val(),d=null;if(typeof v==="string"){try{d=JSON.parse(v);}catch(e){d=null;}}cb({exists:!!d,data:function(){return d;}});},err);}
  };

   if(started){return;}started=true;clearTimeout(timeout);dbOK=true;
   ref.onSnapshot(function(snap){if(!loaded){setStatus("");}onStateSnap(snap);},function(){setStatus("Lost the connection to the scoreboard server. Reload this page.");});
  }
  fbBase.child("plans").on("value",function(s){
   var m={};s.forEach(function(c){var v=c.val();if(typeof v==="string"){try{m[c.key]=JSON.parse(v);}catch(e){}}});
   mergePlans(m);startState();
  },function(){clearTimeout(timeout);setStatus("The scoreboard server refused the connection. Check the code and the Firebase rules.");});
 }catch(e){setStatus("Couldn\u2019t start the scoreboard server connection.");}
}
